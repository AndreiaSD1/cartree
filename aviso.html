<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitação de Certidão</title>

<style>

body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background-image: url(imgfundo.jpg.jpeg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    margin:0;
    padding:20px;
}

.caixa{
    background: rgba(255,255,255,0.95);
    max-width:500px;
    width:100%;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#222;
    margin-bottom:20px;
    font-size:24px;
}

p{
    color:#393838;
    line-height:1.6;
    font-size:17px;
    margin-bottom:30px;
}

.botao{
    display:inline-block;
    background:#222;
    color:white;
    text-decoration:none;
    padding:14px 30px;
    border-radius:12px;
    transition:0.2s;
    font-weight:bold;
}

.botao:hover{
    background:#000;
    transform:scale(1.03);
}

</style>
</head>

<body>

<div class="caixa">

<h1>Solicitação de Certidões</h1>

<p>
Para prosseguir com a solicitação de certidões de atos notariais,
é necessária a prévia emissão de certificado digital notarizado,
conforme exigências de autenticação e segurança jurídica.
</p>

<p>
Clique no botão abaixo para continuar o procedimento.
</p>

<a class="botao"
href="assinatura.e-notariado.org.br/private/acknowledgment-request">
CONTINUAR
</a>

</div>

</body>
</html>
